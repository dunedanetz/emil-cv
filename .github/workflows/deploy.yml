name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Never run two deploys at the same time
concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key and pinned host key
        run: |
          mkdir -p ~/.ssh
          # Key is stored base64-encoded (single line) to survive copy/paste
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fail fast with a clear message if the secret is truncated or malformed
          ssh-keygen -lf ~/.ssh/deploy_key || { echo "::error::DEPLOY_SSH_KEY is not a valid key (decoded $(wc -c < ~/.ssh/deploy_key) bytes, expected about 400)"; exit 1; }
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy with rsync
        run: |
          rsync -rltvz --delete \
            --chmod=D755,F644 \
            --exclude=".git*" --exclude="README.md" --exclude="nginx/" \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ deploy-cv@${{ secrets.VPS_HOST }}:

      - name: Smoke test
        run: curl -sf -o /dev/null https://emil.chiliseeds-shop.com/ && echo "Site is up"
